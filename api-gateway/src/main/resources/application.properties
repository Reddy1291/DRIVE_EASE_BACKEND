# API Gateway Configuration
server.port=8080
spring.application.name=API-GATEWAY

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# JWT Configuration (same secret as user-service for token validation)
jwt.secret=DriveEaseJWTSecretKey2026ForSecureTokenGenerationAndValidation

# Gateway Routes - User Service
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**

# Gateway Routes - Vehicle Service
spring.cloud.gateway.routes[1].id=vehicle-service
spring.cloud.gateway.routes[1].uri=lb://VEHICLE-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/vehicles/**

# Gateway Routes - Booking Service
spring.cloud.gateway.routes[2].id=booking-service
spring.cloud.gateway.routes[2].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/bookings/**
